<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Okanzo — marketing posters</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { background:#05060a; font-family:'Segoe UI', Roboto, system-ui, sans-serif; }

  .poster {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background:
      radial-gradient(120% 55% at 50% -8%, #3a2b7a 0%, #241a52 26%, #120f2b 52%, #0a0a1a 74%, #06060f 100%);
    color:#fff;
  }
  /* faint square grid band near top */
  .poster::before{
    content:""; position:absolute; inset:0 0 auto 0; height:560px;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:46px 46px; background-position:center top;
    -webkit-mask-image: radial-gradient(100% 100% at 50% 0%, #000 0%, transparent 70%);
            mask-image: radial-gradient(100% 100% at 50% 0%, #000 0%, transparent 70%);
    opacity:.6;
  }
  /* dotted texture full */
  .poster::after{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,.05) 1.4px, transparent 1.6px);
    background-size:30px 30px; opacity:.35; pointer-events:none;
  }
  .content{ position:relative; z-index:3; height:100%; display:flex; flex-direction:column; align-items:center; padding:96px 84px 76px; }

  .badge{
    display:inline-flex; align-items:center; gap:14px;
    border:1.5px solid rgba(255,255,255,.28); border-radius:100px;
    padding:16px 32px; font-size:26px; font-weight:800; letter-spacing:4px;
    color:#EA
    F; color:#EDE7FF; text-transform:uppercase; background:rgba(255,255,255,.05);
  }
  .badge svg{ width:30px; height:30px; }
  .badge .bt{ background:linear-gradient(90deg,#B9A8FF,#8B7BFF); -webkit-background-clip:text; background-clip:text; color:transparent; }

  h1{ text-align:center; font-weight:900; font-size:104px; line-height:.98; letter-spacing:-2.5px; margin-top:44px; }
  h1 .accent{ color:#A78BFA; background:linear-gradient(92deg,#8B5CF6,#C084FC 55%,#E879F9); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub{ text-align:center; font-size:34px; line-height:1.42; color:#AEB4C6; margin-top:34px; max-width:820px; font-weight:500; }
  .sub b{ color:#EAECF4; font-weight:800; }

  .stage{ position:relative; flex:1; width:100%; margin-top:30px; display:flex; align-items:flex-end; justify-content:center; }

  /* ---- device ---- */
  .phone{
    width:560px; height:1180px; border-radius:66px; padding:14px;
    background:linear-gradient(#20242c,#0c0e12);
    box-shadow: 0 60px 120px -30px rgba(0,0,0,.75), 0 0 0 2px rgba(255,255,255,.06) inset;
    position:relative;
  }
  .phone .screen{ width:100%; height:100%; border-radius:52px; overflow:hidden; position:relative; background:var(--abg); color:#E8EDF4; }
  .phone .island{ position:absolute; top:20px; left:50%; transform:translateX(-50%); width:132px; height:34px; border-radius:20px; background:#000; z-index:20; }
  .tilt{ transform: perspective(2600px) rotateY(-20deg) rotateX(5deg) rotateZ(2deg); transform-origin:center bottom; box-shadow:0 70px 130px -30px rgba(0,0,0,.8); }
  .tilt-r{ transform: perspective(2600px) rotateY(18deg) rotateX(5deg) rotateZ(-2deg); }

  /* ---- app screen ---- */
  :root{
    --abg: radial-gradient(130% 90% at 50% 0%, #151b26 0%, #0d1119 58%, #090b11 100%);
    --card:#161C26; --line:rgba(255,255,255,.07); --muted:#8B94A6; --text:#E8EDF4;
    --c-indigo:#6C8BFF; --c-emerald:#34D399; --c-amber:#FBBF24; --c-cyan:#22D3EE; --c-violet:#A78BFA; --c-orange:#FB923C; --c-pink:#F472B6;
  }
  .sc{ position:absolute; inset:0; padding:56px 30px 0; display:flex; flex-direction:column; }
  .stat{ display:flex; align-items:center; justify-content:space-between; font-size:20px; font-weight:700; color:#cfd6e2; padding:2px 8px 14px; }
  .stat .r{ display:flex; gap:8px; align-items:center; }
  .stat svg{ width:22px; height:22px; }
  .top{ display:flex; align-items:center; gap:6px; padding:2px 4px 14px; }
  .top .h{ font-size:30px; font-weight:800; flex:1; letter-spacing:-.4px; }
  .top .ic{ width:52px; height:52px; border-radius:50%; display:grid; place-items:center; color:#aab2c2; }
  .top .ic svg{ width:28px; height:28px; }

  .hero{ border-radius:30px; padding:30px 30px 26px; color:#fff; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#12B5A6 0%,#4F46E5 52%,#7C3AED 100%);
    box-shadow:0 24px 44px -22px rgba(79,70,229,.7); }
  .hero .hl{ font-size:22px; font-weight:800; letter-spacing:1.5px; opacity:.9; }
  .hero .nw{ font-size:70px; font-weight:900; letter-spacing:-2px; margin:8px 0 22px; }
  .hero .mrow{ display:flex; gap:16px; }
  .hero .m{ flex:1; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); border-radius:20px; padding:16px 18px; }
  .hero .m .ml{ font-size:19px; font-weight:800; opacity:.95; display:flex; align-items:center; gap:8px; }
  .hero .m .mv{ font-size:27px; font-weight:900; margin-top:6px; letter-spacing:-.5px; }

  .shead{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 6px 16px; }
  .shead .t{ font-size:24px; font-weight:800; }
  .shead .v{ font-size:24px; font-weight:800; color:var(--muted); }

  .cat{ display:flex; align-items:center; gap:18px; background:var(--card); border:1px solid var(--line);
    border-left:6px solid var(--ac); border-radius:22px; padding:20px 22px; margin-bottom:16px; }
  .cat .chip{ width:60px; height:60px; border-radius:18px; display:grid; place-items:center; background:color-mix(in srgb, var(--ac) 22%, transparent); color:var(--ac); }
  .cat .chip svg{ width:32px; height:32px; }
  .cat .b{ flex:1; }
  .cat .n{ font-size:26px; font-weight:800; }
  .cat .meta{ font-size:19px; color:var(--muted); margin-top:3px; }
  .cat .val{ font-size:27px; font-weight:900; letter-spacing:-.5px; }
  .cat .chev{ color:var(--muted); opacity:.6; margin-left:4px; }
  .cat .chev svg{ width:26px; height:26px; }

  .subrow{ display:flex; align-items:center; padding:14px 22px 14px 92px; }
  .subrow .sn{ font-size:22px; font-weight:700; }
  .subrow .sm{ font-size:17px; color:var(--muted); margin-top:2px; }
  .subrow .sv{ margin-left:auto; font-size:22px; font-weight:800; }

  .fab{ position:absolute; right:34px; bottom:130px; height:74px; padding:0 30px; border-radius:24px; display:flex; align-items:center; gap:12px;
    background:linear-gradient(135deg,#7C3AED,#EC4899); color:#fff; font-size:27px; font-weight:900; box-shadow:0 18px 34px -10px rgba(124,58,237,.7); }
  .fab svg{ width:30px; height:30px; }

  .nav{ position:absolute; left:0; right:0; bottom:0; height:104px; display:flex; align-items:center; justify-content:space-around;
    background:rgba(10,13,19,.82); border-top:1px solid var(--line); backdrop-filter:blur(10px); }
  .nav .ni{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:18px; font-weight:700; color:var(--muted); }
  .nav .ni svg{ width:32px; height:32px; }
  .nav .ni.on{ color:#C4B5FD; }
  .nav .ni.on .p{ background:rgba(167,139,250,.22); border-radius:18px; padding:4px 22px; }

  /* donut */
  .donut{ width:300px; height:300px; border-radius:50%; margin:8px auto 0; position:relative;
    -webkit-mask: radial-gradient(closest-side, transparent 62%, #000 63%); mask: radial-gradient(closest-side, transparent 62%, #000 63%); }
  .donut .lbl{ position:absolute; inset:0; display:grid; place-items:center; -webkit-mask:none; mask:none; }
  .legend{ margin-top:26px; display:flex; flex-direction:column; gap:14px; }
  .legend .li{ display:flex; align-items:center; gap:14px; font-size:23px; }
  .legend .dot{ width:20px; height:20px; border-radius:6px; }
  .legend .lv{ margin-left:auto; font-weight:800; color:#cfd6e2; }
  .miniStats{ display:flex; gap:16px; margin-top:26px; }
  .miniStats .ms{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px 20px; }
  .miniStats .ms .k{ font-size:34px; font-weight:900; letter-spacing:-1px; }
  .miniStats .ms .l{ font-size:17px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:1px; }

  /* lock */
  .lock{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:0 40px; }
  .lock .logo{ width:132px; height:132px; border-radius:34px; display:grid; place-items:center; background:linear-gradient(135deg,#00897B,#1B5E20); box-shadow:0 20px 40px -14px rgba(0,137,123,.6); }
  .lock .logo svg{ width:78px; height:78px; }
  .lock .app{ font-size:38px; font-weight:900; margin-top:26px; letter-spacing:-.5px; }
  .lock .masked{ font-size:58px; font-weight:900; letter-spacing:6px; color:#5c6474; margin:14px 0 40px; }
  .lock .fp{ width:150px; height:150px; border-radius:50%; display:grid; place-items:center; border:3px solid transparent;
    background:linear-gradient(#0d1119,#0d1119) padding-box, conic-gradient(from 0deg,#12B5A6,#7C3AED,#EC4899,#12B5A6) border-box; }
  .lock .fp svg{ width:78px; height:78px; color:#C4B5FD; }
  .lock .hint{ font-size:24px; color:var(--muted); margin-top:26px; }

  /* portfolios */
  .pcard{ background:var(--card); border:1px solid var(--line); border-radius:24px; padding:24px; margin-bottom:18px; position:relative; overflow:hidden; }
  .pcard .pt{ display:flex; align-items:center; gap:14px; }
  .pcard .pchip{ width:56px; height:56px; border-radius:16px; display:grid; place-items:center; background:color-mix(in srgb,var(--ac) 22%, transparent); color:var(--ac); }
  .pcard .pchip svg{ width:30px; height:30px; }
  .pcard .pn{ font-size:27px; font-weight:800; }
  .pcard .pbadge{ font-size:15px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--ac); border:1.5px solid color-mix(in srgb,var(--ac) 55%, transparent); border-radius:100px; padding:4px 12px; margin-left:8px; }
  .pcard .pv{ font-size:40px; font-weight:900; letter-spacing:-1px; margin:18px 0 14px; }
  .pcard .bar{ height:12px; border-radius:8px; background:rgba(255,255,255,.08); overflow:hidden; }
  .pcard .bar > span{ display:block; height:100%; border-radius:8px; background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 40%, #ffffff)); }

  /* export */
  .expcard{ background:linear-gradient(135deg,#12B5A6,#4F46E5); border-radius:26px; padding:30px; color:#fff; box-shadow:0 24px 44px -22px rgba(79,70,229,.7); }
  .expcard .et{ font-size:30px; font-weight:900; }
  .expcard .ed{ font-size:20px; opacity:.92; margin-top:8px; line-height:1.4; }
  .field{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 22px; margin-top:18px; display:flex; align-items:center; gap:14px; }
  .field .fl{ font-size:22px; color:var(--muted); flex:1; }
  .field .fv{ font-size:22px; font-weight:800; }
  .chk{ display:flex; align-items:center; gap:14px; margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 22px; }
  .chk .box{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#34D399,#10B981); display:grid; place-items:center; }
  .chk .box svg{ width:22px; height:22px; color:#04231b; }
  .chk .ct{ font-size:22px; font-weight:700; }

  /* ---- floating callouts ---- */
  .callout{ position:absolute; z-index:6; display:flex; align-items:center; gap:18px;
    background:rgba(20,18,38,.92); border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:18px 24px;
    box-shadow:0 30px 60px -24px rgba(0,0,0,.8); backdrop-filter:blur(6px); }
  .callout .cc{ width:60px; height:60px; border-radius:16px; display:grid; place-items:center; }
  .callout .cc svg{ width:32px; height:32px; }
  .callout .ct{ font-size:27px; font-weight:900; letter-spacing:-.4px; color:#fff; }
  .callout .cs{ font-size:18px; font-weight:800; letter-spacing:1.4px; color:#98A0B4; text-transform:uppercase; margin-top:3px; }

  /* ---- bottom ---- */
  .pills{ display:flex; gap:22px; justify-content:center; z-index:4; }
  .pills .pill{ border:1.5px solid rgba(255,255,255,.22); border-radius:100px; padding:18px 34px; font-size:26px; font-weight:800; letter-spacing:2px; color:#D7DAE6; background:rgba(255,255,255,.04); }
  .brand{ display:flex; align-items:center; gap:20px; z-index:4; }
  .brand .bl{ width:74px; height:74px; border-radius:20px; display:grid; place-items:center; background:linear-gradient(135deg,#00897B,#1B5E20); box-shadow:0 16px 30px -12px rgba(0,137,123,.6); }
  .brand .bl svg{ width:44px; height:44px; }
  .brand .bn{ font-size:44px; font-weight:900; letter-spacing:-.5px; }
  .brand .bt{ font-size:28px; font-weight:800; letter-spacing:3px; color:#8b93a6; }
</style>
</head>

};

function statusbar(){ return `<div class="stat"><span>9:41</span><span class="r">${I.wifi}${I.batt}<span>90%</span></span></div>`; }

/* ------- app screens ------- */
function homeScreen(expanded){
  const cats = [
    {ac:'--c-indigo', ic:'stock', n:'Stock', meta:'2 items · Expand', val:'₹48,44,767', exp:expanded},
    {ac:'--c-emerald', ic:'cash', n:'Cash', meta:'2 items', val:'₹78,776'},

function posterHTML(p){
  const h = p.accentLine!==undefined
    ? p.h.map((line,i)=> i===p.accentLine ? `<span class="accent">${line}</span>` : line).join('<br>')
    : p.h.join('<br>');
  return `<div class="poster" data-file="${p.file}">
    <div class="content">
      <div class="badge">${I[p.badgeIcon]}<span class="bt">${p.badge}</span></div>
      <h1>${h}</h1>
      <div class="sub">${p.sub}</div>
      <div class="stage">
        ${p.callouts.map(calloutHTML).join('')}
        <div class="phone ${p.phoneClass}"><div class="island"></div><div class="screen">${p.screen()}</div></div>
      </div>
      ${bottomHTML(p.bottom)}
    </div>
  </div>`;
}

// Single-poster export mode: marketing.html?p=INDEX renders just one 1080x1920 poster.
const _params = new URLSearchParams(location.search);
const _single = _params.get('p');
if (_single !== null) {
  const idx = parseInt(_single, 10);
  document.documentElement.style.background = '#05060a';
  document.body.style.width = '1080px';
  document.body.style.height = '1920px';
  document.body.style.overflow = 'hidden';
  document.getElementById('root').innerHTML = posterHTML(POSTERS[idx]);
}
